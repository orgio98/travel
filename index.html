<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>나의 맛집·카페 아카이브</title>
  <!-- Leaflet CSS (무료 지도 뷰) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent: #f59e0b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }
    .header-top {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 1.2rem;
      margin: 0;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .count-badge {
      font-size: 0.78rem;
      background: #eff6ff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 0.84rem;
      font-weight: 600;
      transition: all 0.15s;
    }
    button:active { transform: scale(0.97); }
    button.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    button.primary:hover { background: var(--primary-hover); }
    button.random-btn {
      background: #fffbeb;
      color: #b45309;
      border-color: #fde68a;
    }

    /* Controls & Filters */
    .controls {
      max-width: 1100px;
      margin: 12px auto 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-row {
      display: flex;
      gap: 8px;
    }
    .search-row input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.92rem;
      background: #f8fafc;
    }
    .search-row select {
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.85rem;
      background: #fff;
    }
    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      white-space: nowrap;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.8rem;
      background: #f1f5f9;
      border: 1px solid transparent;
      color: var(--muted);
    }
    .chip.active {
      background: var(--text);
      color: #fff;
    }

    /* Main Container */
    main {
      max-width: 1100px;
      margin: 16px auto;
      padding: 0 16px;
    }

    /* Grid View */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 680px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1000px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }
    .card-img-wrap {
      position: relative;
      width: 100%;
      height: 190px;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cat-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.78);
      color: #fff;
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 6px;
      font-weight: 600;
    }
    .revisit-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #10b981;
      color: #fff;
      font-size: 0.74rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .card-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .card-title {
      font-size: 1.08rem;
      font-weight: 700;
      margin: 0;
    }
    .rating {
      color: var(--accent);
      font-weight: 700;
      font-size: 0.92rem;
      white-space: nowrap;
    }
    .meta-row {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .region-tag {
      color: var(--primary);
      font-weight: 600;
    }
    .menu-line {
      font-size: 0.83rem;
      background: #f8fafc;
      padding: 5px 8px;
      border-radius: 6px;
      color: #334155;
    }
    .memo-text {
      font-size: 0.88rem;
      line-height: 1.45;
      color: #334155;
      margin: 2px 0 6px;
      white-space: pre-line;
    }
    .card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .map-links {
      display: flex;
      gap: 4px;
    }
    .map-links a {
      text-decoration: none;
      font-size: 0.75rem;
      padding: 4px 7px;
      border-radius: 6px;
      background: #f1f5f9;
      color: #334155;
      font-weight: 600;
    }
    .map-links a:hover { background: #e2e8f0; }
    .card-btns button {
      padding: 4px 8px;
      font-size: 0.76rem;
    }

    /* Map View */
    #mapView {
      display: none;
      height: calc(100vh - 170px);
      min-height: 420px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    #map { width: 100%; height: 100%; }

    /* Empty State */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    /* Floating Add Button */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 22px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      border: none;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      z-index: 90;
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.2);
    }
    .modal h2 {
      margin: 0 0 14px;
      font-size: 1.15rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #334155;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 0.92rem;
      font-family: inherit;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .preview-box {
      margin-top: 8px;
      position: relative;
      display: none;
    }
    .preview-box img {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 9px;
      border: 1px solid var(--border);
    }
    .exif-status {
      font-size: 0.78rem;
      color: var(--primary);
      margin-top: 4px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .checkbox-row input { width: auto; }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>🍽️ 방문 장소 아카이브 <span class="count-badge" id="totalCount">0곳</span></h1>
    <div class="header-actions">
      <button class="random-btn" onclick="pickRandom()">🎲 랜덤 추천</button>
      <button id="viewToggleBtn" onclick="toggleView()">🗺️ 지도 뷰</button>
      <button onclick="exportData()">백업</button>
      <button onclick="document.getElementById('importFile').click()">복원</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)" />
    </div>
  </div>

  <div class="controls">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="상호명, 지역(#원주), 메뉴, 메모 검색..." oninput="render()" />
      <select id="sortSelect" onchange="render()">
        <option value="dateDesc">최신 방문순</option>
        <option value="ratingDesc">별점 높은순</option>
        <option value="nameAsc">가나다순</option>
      </select>
    </div>
    <div class="chips" id="categoryChips">
      <button class="chip active" data-cat="ALL" onclick="setCategory('ALL')">전체</button>
      <button class="chip" data-cat="한식" onclick="setCategory('한식')">한식</button>
      <button class="chip" data-cat="양식" onclick="setCategory('양식')">양식</button>
      <button class="chip" data-cat="일식/중식" onclick="setCategory('일식/중식')">일식/중식</button>
      <button class="chip" data-cat="카페/디저트" onclick="setCategory('카페/디저트')">카페/디저트</button>
      <button class="chip" data-cat="주점/기타" onclick="setCategory('주점/기타')">주점/기타</button>
      <button class="chip" data-cat="REVISIT" onclick="setCategory('REVISIT')">👍 재방문 의사</button>
    </div>
  </div>
</header>

<main>
  <div id="listView">
    <div class="grid" id="placeGrid"></div>
    <div class="empty" id="emptyState" style="display:none;">
      아직 기록된 장소가 없습니다.<br/>오른쪽 아래 <b>+</b> 버튼을 눌러 첫 맛집·카페를 추가해 보세요!
    </div>
  </div>

  <div id="mapView">
    <div id="map"></div>
  </div>
</main>

<button class="fab" onclick="openModal()" title="새 장소 기록">+</button>

<!-- 등록 / 수정 모달 -->
<div class="modal-backdrop" id="placeModal">
  <div class="modal">
    <h2>
      <span id="modalTitle">새 장소 기록</span>
      <button onclick="closeModal()" style="border:none;background:none;font-size:1.2rem;">✕</button>
    </h2>
    <form id="placeForm" onsubmit="savePlace(event)">
      <input type="hidden" id="placeId" />

      <div class="form-group">
        <label>사진 첨부 (촬영일·GPS 자동 추출)</label>
        <input type="file" id="photoInput" accept="image/*" onchange="handlePhoto(event)" />
        <div class="exif-status" id="exifStatus"></div>
        <div class="preview-box" id="previewBox">
          <img id="photoPreview" alt="미리보기" />
          <button type="button" onclick="clearPhoto()" style="margin-top:4px;font-size:0.75rem;">사진 삭제</button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>상호명 *</label>
          <input type="text" id="nameInput" required placeholder="예: 온천집, 블루보틀" />
        </div>
        <div class="form-group">
          <label>카테고리</label>
          <select id="categoryInput">
            <option value="한식">한식</option>
            <option value="양식">양식</option>
            <option value="일식/중식">일식/중식</option>
            <option value="카페/디저트">카페/디저트</option>
            <option value="주점/기타">주점/기타</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>지역 태그</label>
          <input type="text" id="regionInput" placeholder="예: 원주, 남가좌동, 상하이" />
        </div>
        <div class="form-group">
          <label>방문일</label>
          <input type="date" id="dateInput" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>별점</label>
          <select id="ratingInput">
            <option value="5">★★★★★ (5.0)</option>
            <option value="4.5">★★★★☆ (4.5)</option>
            <option value="4" selected>★★★★ (4.0)</option>
            <option value="3.5">★★★☆ (3.5)</option>
            <option value="3">★★★ (3.0)</option>
            <option value="2">★★ (2.0)</option>
            <option value="1">★ (1.0)</option>
          </select>
        </div>
        <div class="form-group">
          <label>대표 메뉴 / 주문 메뉴</label>
          <input type="text" id="menuInput" placeholder="예: 아메리카노, 까눌레" />
        </div>
      </div>

      <div class="form-group">
        <label>한줄평 & 메모 (주차, 웨이팅, 분위기 등)</label>
        <textarea id="memoInput" rows="3" placeholder="맛, 가격, 재방문 시 참고할 점을 자유롭게 적어주세요."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>위도 (Latitude, 선택)</label>
          <input type="number" step="any" id="latInput" placeholder="사진 GPS 자동입력" />
        </div>
        <div class="form-group">
          <label>경도 (Longitude, 선택)</label>
          <input type="number" step="any" id="lngInput" placeholder="사진 GPS 자동입력" />
        </div>
      </div>

      <div class="form-group">
        <label class="checkbox-row">
          <input type="checkbox" id="revisitInput" checked />
          <span>다음에 또 방문하고 싶은 곳 (재방문 의사)</span>
        </label>
      </div>

      <div class="modal-footer">
        <button type="button" onclick="closeModal()">취소</button>
        <button type="submit" class="primary">저장하기</button>
      </div>
    </form>
  </div>
</div>

<!-- 외부 라이브러리: exifr(사진 메타데이터 파싱), Leaflet(지도) -->
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const STORAGE_KEY = 'visited_places_archive_v1';
  let places = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let currentCategory = 'ALL';
  let isMapView = false;
  let mapInstance = null;
  let markerLayer = null;
  let currentPhotoDataUrl = '';

  // 초기 실행
  document.addEventListener('DOMContentLoaded', () => {
    render();
  });

  function saveToStorage() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(places));
    } catch (e) {
      alert('저장 공간이 부족합니다. 상단 [백업] 버튼으로 JSON 파일을 저장한 뒤 오래된 사진 일부를 정리해 주세요.');
    }
  }

  // 사진 처리: EXIF 추출 + 800px 리사이징 압축
  async function handlePhoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    const statusEl = document.getElementById('exifStatus');
    statusEl.textContent = '사진 분석 및 최적화 중...';

    try {
      // 1. EXIF 날짜 및 GPS 추출
      if (window.exifr) {
        const exif = await exifr.parse(file, { gps: true, pick: ['DateTimeOriginal', 'CreateDate'] });
        let infoMsgs = [];

        if (exif) {
          const dt = exif.DateTimeOriginal || exif.CreateDate;
          if (dt instanceof Date && !isNaN(dt)) {
            const yyyy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            document.getElementById('dateInput').value = `${yyyy}-${mm}-${dd}`;
            infoMsgs.push(`촬영일(${yyyy}-${mm}-${dd})`);
          }
          if (typeof exif.latitude === 'number' && typeof exif.longitude === 'number') {
            document.getElementById('latInput').value = exif.latitude.toFixed(6);
            document.getElementById('lngInput').value = exif.longitude.toFixed(6);
            infoMsgs.push('GPS 좌표');
          }
        }
        statusEl.textContent = infoMsgs.length
          ? `✅ 자동 추출 완료: ${infoMsgs.join(', ')}`
          : 'ℹ️ 사진에 날짜/위치 메타데이터가 없어 직접 입력할 수 있습니다.';
      }

      // 2. Canvas 리사이징 (가로 최대 800px, JPEG 품질 0.78)
      currentPhotoDataUrl = await compressImage(file, 800, 0.78);
      document.getElementById('photoPreview').src = currentPhotoDataUrl;
      document.getElementById('previewBox').style.display = 'block';
    } catch (err) {
      console.error(err);
      statusEl.textContent = '사진 처리 중 오류가 발생했습니다.';
    }
  }

  function compressImage(file, maxWidth, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function clearPhoto() {
    currentPhotoDataUrl = '';
    document.getElementById('photoInput').value = '';
    document.getElementById('previewBox').style.display = 'none';
    document.getElementById('exifStatus').textContent = '';
  }

  // 모달 열기/닫기
  function openModal(id = null) {
    const form = document.getElementById('placeForm');
    form.reset();
    clearPhoto();

    if (id) {
      const item = places.find(p => p.id === id);
      if (!item) return;
      document.getElementById('modalTitle').textContent = '장소 정보 수정';
      document.getElementById('placeId').value = item.id;
      document.getElementById('nameInput').value = item.name;
      document.getElementById('categoryInput').value = item.category;
      document.getElementById('regionInput').value = item.region || '';
      document.getElementById('dateInput').value = item.date || '';
      document.getElementById('ratingInput').value = item.rating;
      document.getElementById('menuInput').value = item.menu || '';
      document.getElementById('memoInput').value = item.memo || '';
      document.getElementById('latInput').value = item.lat || '';
      document.getElementById('lngInput').value = item.lng || '';
      document.getElementById('revisitInput').checked = !!item.revisit;

      if (item.photo) {
        currentPhotoDataUrl = item.photo;
        document.getElementById('photoPreview').src = item.photo;
        document.getElementById('previewBox').style.display = 'block';
      }
    } else {
      document.getElementById('modalTitle').textContent = '새 장소 기록';
      document.getElementById('placeId').value = '';
      document.getElementById('dateInput').value = new Date().toISOString().slice(0, 10);
      document.getElementById('revisitInput').checked = true;
    }

    document.getElementById('placeModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('placeModal').classList.remove('open');
  }

  // 저장
  function savePlace(e) {
    e.preventDefault();
    const id = document.getElementById('placeId').value;
    const latVal = parseFloat(document.getElementById('latInput').value);
    const lngVal = parseFloat(document.getElementById('lngInput').value);

    const record = {
      id: id || 'place_' + Date.now(),
      name: document.getElementById('nameInput').value.trim(),
      category: document.getElementById('categoryInput').value,
      region: document.getElementById('regionInput').value.trim().replace(/^#/, ''),
      date: document.getElementById('dateInput').value,
      rating: parseFloat(document.getElementById('ratingInput').value),
      menu: document.getElementById('menuInput').value.trim(),
      memo: document.getElementById('memoInput').value.trim(),
      lat: !isNaN(latVal) ? latVal : null,
      lng: !isNaN(lngVal) ? lngVal : null,
      revisit: document.getElementById('revisitInput').checked,
      photo: currentPhotoDataUrl,
      updatedAt: Date.now()
    };

    if (id) {
      const idx = places.findIndex(p => p.id === id);
      if (idx > -1) places[idx] = record;
    } else {
      places.unshift(record);
    }

    saveToStorage();
    closeModal();
    render();
  }

  function deletePlace(id) {
    if (!confirm('이 장소 기록을 삭제할까요?')) return;
    places = places.filter(p => p.id !== id);
    saveToStorage();
    render();
  }

  // 필터 및 정렬
  function setCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.chip').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.cat === cat);
    });
    render();
  }

  function getFilteredPlaces() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const sort = document.getElementById('sortSelect').value;

    let list = places.filter(p => {
      if (currentCategory === 'REVISIT' && !p.revisit) return false;
      if (currentCategory !== 'ALL' && currentCategory !== 'REVISIT' && p.category !== currentCategory) return false;

      if (q) {
        const target = `${p.name} ${p.region} ${p.menu} ${p.memo} ${p.category}`.toLowerCase();
        if (!target.includes(q)) return false;
      }
      return true;
    });

    list.sort((a, b) => {
      if (sort === 'ratingDesc') return b.rating - a.rating;
      if (sort === 'nameAsc') return a.name.localeCompare(b.name, 'ko');
      return (b.date || '').localeCompare(a.date || '');
    });

    return list;
  }

  // 렌더링
  function render() {
    const filtered = getFilteredPlaces();
    document.getElementById('totalCount').textContent = `${filtered.length}곳`;

    const grid = document.getElementById('placeGrid');
    const empty = document.getElementById('emptyState');

    if (filtered.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      grid.innerHTML = filtered.map(p => {
        const query = encodeURIComponent(`${p.region ? p.region + ' ' : ''}${p.name}`);
        const naverUrl = `https://map.naver.com/p/search/${query}`;
        const kakaoUrl = `https://map.kakao.com/?q=${query}`;
        const googleUrl = (p.lat && p.lng)
          ? `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`
          : `https://www.google.com/maps/search/?api=1&query=${query}`;

        return `
          <article class="card">
            <div class="card-img-wrap">
              ${p.photo ? `<img src="${p.photo}" alt="${escapeHtml(p.name)}" loading="lazy" />` : '<span>📷 사진 없음</span>'}
              <span class="cat-badge">${escapeHtml(p.category)}</span>
              ${p.revisit ? '<span class="revisit-badge">재방문 OK</span>' : ''}
            </div>
            <div class="card-body">
              <div class="card-title-row">
                <h3 class="card-title">${escapeHtml(p.name)}</h3>
                <span class="rating">★ ${p.rating.toFixed(1)}</span>
              </div>
              <div class="meta-row">
                ${p.region ? `<span class="region-tag">#${escapeHtml(p.region)}</span>` : ''}
                ${p.date ? `<span>📅 ${p.date}</span>` : ''}
                ${(p.lat && p.lng) ? `<span>📍 GPS 저장됨</span>` : ''}
              </div>
              ${p.menu ? `<div class="menu-line">🍴 ${escapeHtml(p.menu)}</div>` : ''}
              ${p.memo ? `<p class="memo-text">${escapeHtml(p.memo)}</p>` : ''}
              <div class="card-footer">
                <div class="map-links">
                  <a href="${naverUrl}" target="_blank" rel="noopener">네이버</a>
                  <a href="${kakaoUrl}" target="_blank" rel="noopener">카카오</a>
                  <a href="${googleUrl}" target="_blank" rel="noopener">구글</a>
                </div>
                <div class="card-btns">
                  <button onclick="openModal('${p.id}')">수정</button>
                  <button onclick="deletePlace('${p.id}')" style="color:var(--danger);">삭제</button>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    if (isMapView) {
      updateMapMarkers(filtered);
    }
  }

  // 지도 뷰 전환 및 마커 표시
  function toggleView() {
    isMapView = !isMapView;
    document.getElementById('listView').style.display = isMapView ? 'none' : 'block';
    document.getElementById('mapView').style.display = isMapView ? 'block' : 'none';
    document.getElementById('viewToggleBtn').textContent = isMapView ? '📋 리스트 뷰' : '🗺️ 지도 뷰';

    if (isMapView) {
      if (!mapInstance) {
        mapInstance = L.map('map').setView([36.5, 127.8], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(mapInstance);
        markerLayer = L.layerGroup().addTo(mapInstance);
      }
      setTimeout(() => {
        mapInstance.invalidateSize();
        updateMapMarkers(getFilteredPlaces());
      }, 100);
    }
  }

  function updateMapMarkers(list) {
    if (!mapInstance || !markerLayer) return;
    markerLayer.clearLayers();
    const bounds = [];

    list.forEach(p => {
      if (typeof p.lat === 'number' && typeof p.lng === 'number') {
        const marker = L.marker([p.lat, p.lng]).addTo(markerLayer);
        marker.bindPopup(`
          <b>${escapeHtml(p.name)}</b> (★ ${p.rating})<br/>
          <small>${escapeHtml(p.category)} · ${p.date || ''}</small><br/>
          ${p.menu ? `<small>메뉴: ${escapeHtml(p.menu)}</small>` : ''}
        `);
        bounds.push([p.lat, p.lng]);
      }
    });

    if (bounds.length > 0) {
      mapInstance.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
    }
  }

  // 랜덤 추천
  function pickRandom() {
    const filtered = getFilteredPlaces();
    if (filtered.length === 0) {
      alert('현재 필터 조건에 맞는 장소가 없습니다.');
      return;
    }
    const pick = filtered[Math.floor(Math.random() * filtered.length)];
    alert(`🎲 오늘의 추천 장소!\n\n[${pick.category}] ${pick.name} (★ ${pick.rating})\n지역: ${pick.region || '미지정'}\n메뉴: ${pick.menu || '-'}\n메모: ${pick.memo || '-'}`);
  }

  // JSON 백업 및 복원
  function exportData() {
    const blob = new Blob([JSON.stringify(places, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `places_archive_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const imported = JSON.parse(e.target.result);
        if (!Array.isArray(imported)) throw new Error('형식 오류');
        if (confirm(`총 ${imported.length}개의 기록을 불러옵니다. 기존 데이터와 병합할까요?\n(취소를 누르면 기존 데이터를 덮어씁니다)`)) {
          const map = new Map(places.map(p => [p.id, p]));
          imported.forEach(item => map.set(item.id, item));
          places = Array.from(map.values());
        } else {
          places = imported;
        }
        saveToStorage();
        render();
        alert('복원이 완료되었습니다.');
      } catch (err) {
        alert('올바른 JSON 백업 파일이 아닙니다.');
      }
      event.target.value = '';
    };
    reader.readAsText(file);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
