<html lang="ko">
<head>

  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --amber: #f59e0b;
      --purple: #7c3aed;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px 0;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .app-title {
      font-size: 1.06rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btns {
      display: flex;
      gap: 5px;
    }
    .btn-sm {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
